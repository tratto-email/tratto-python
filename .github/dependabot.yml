# Dependency updates. Monthly and grouped on purpose: every PR runs CI, and
# the organization's Actions budget is 3000 minutes a month (September 2026:
# 3075 used, 136 of them by this group of public repos, which do not count
# against the budget). See tratto-api#457.
#
# PRs target `main`, the default branch: a `target-branch` pointing elsewhere
# would turn off security updates, which only run on the default branch.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
